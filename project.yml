name: NightClock
options:
  bundleIdPrefix: com.personal
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO

targets:
  NightClock:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: NightClock
        excludes:
          - Info.plist
    settings:
      base:
        INFOPLIST_FILE: NightClock/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.nightclock
        PRODUCT_NAME: NightClock
        CODE_SIGN_STYLE: Manual
        ENABLE_BITCODE: NO
