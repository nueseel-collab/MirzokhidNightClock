name: Build Unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned archive
        run: |
          xcodebuild clean archive \
            -project NightClock.xcodeproj \
            -scheme NightClock \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/NightClock.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package and verify unsigned IPA
        run: |
          APP_PATH="build/NightClock.xcarchive/Products/Applications/NightClock.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Error: NightClock.app not found!"
            exit 1
          fi

          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -r -y NightClock-unsigned.ipa Payload

          echo "Verifying IPA structure..."
          unzip -l NightClock-unsigned.ipa | grep "Payload/NightClock.app/NightClock"
          unzip -l NightClock-unsigned.ipa | grep "Payload/NightClock.app/Info.plist"

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NightClock-unsigned-ipa
          path: build/NightClock-unsigned.ipa
          retention-days: 14
